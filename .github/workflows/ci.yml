name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint application and Convex code
        run: npm run lint

      - name: Typecheck application, tests, and Convex schema
        run: npm run typecheck

      # Fails the job if any metric is below 85% globally or in any functional
      # area (thresholds live in scripts/coverage-policy.mjs). Tests use mocks
      # and convex-test only; no live services or credentials are needed.
      - name: Run unit tests with coverage
        env:
          REGISTRATION_ALLOWED_ORIGINS: https://hackuta.test
        run: npm run test:unit:coverage

      - name: Publish coverage summary by functional area
        if: ${{ !cancelled() }}
        run: npm run test:coverage:check

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: |
            coverage/unit/
            coverage/merged/
          if-no-files-found: warn
          retention-days: 14

      - name: Build production application
        env:
          # Browser tests intercept these endpoints; no real deployment is contacted.
          VITE_CONVEX_URL: https://standing-manatee-425.convex.cloud
          VITE_CONVEX_SITE_URL: https://standing-manatee-425.convex.site
          VITE_USE_MOCK_API: "true"
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: Browser and accessibility tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download production build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).dependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test production build
        env:
          PLAYWRIGHT_USE_BUILD: "true"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret leak scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
